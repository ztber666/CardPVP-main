<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CardPVP - 线上卡牌对战</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🃏</text></svg>" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }

      /* === Loading Screen === */
      #ls {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        background: linear-gradient(135deg, #c3b091 0%, #b8a685 50%, #ad9870 100%);
        transition: opacity 0.6s ease, visibility 0.6s ease;
        -webkit-tap-highlight-color: transparent;
      }
      #ls.done { opacity: 0; visibility: hidden; pointer-events: none; }

      .ls-card {
        width: 300px; max-width: calc(100vw - 32px);
        text-align: center; -webkit-user-select: none; -moz-user-select: none; user-select: none;
        padding: 32px 28px;
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(61, 50, 41, 0.12);
        border-radius: 20px;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        box-shadow: 0 8px 32px rgba(61, 50, 41, 0.08);
      }

      /* Logo */
      .ls-logo {
        font-size: 44px; line-height: 1;
        animation: ls-float 2.2s ease-in-out infinite;
      }
      @keyframes ls-float {
        0%, 100% { transform: translateY(0) rotate(-2deg); }
        50% { transform: translateY(-10px) rotate(3deg); }
      }

      /* Title */
      .ls-title {
        font-size: 26px; font-weight: 800; letter-spacing: 3px;
        background: linear-gradient(135deg, #3d3229, #7a6552);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        background-clip: text;
        margin: 10px 0 16px;
        animation: ls-fadeUp 0.5s ease-out 0.1s backwards;
      }

      /* Percentage */
      .ls-pct {
        font-size: 34px; font-weight: 800; color: #3d3229;
        font-variant-numeric: tabular-nums;
        letter-spacing: -1px; line-height: 1.2;
        animation: ls-fadeUp 0.5s ease-out 0.15s backwards;
      }

      /* Progress bar */
      .ls-track {
        width: 100%; height: 7px;
        background: rgba(61, 50, 41, 0.12);
        border-radius: 4px; overflow: hidden;
        margin-top: 12px;
        animation: ls-fadeUp 0.5s ease-out 0.2s backwards;
      }
      .ls-fill {
        height: 100%; width: 0%; border-radius: 4px;
        background: linear-gradient(90deg, #8b7355, #6b5b4a, #5a4a3a);
        transition: width 0.4s cubic-bezier(0.25, 0.1, 0.25, 1);
        position: relative; overflow: hidden;
      }
      .ls-fill::after {
        content: ''; position: absolute; inset: 0;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.45), transparent);
        animation: ls-shimmer 1.5s ease-in-out infinite;
      }
      @keyframes ls-shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(200%); }
      }

      /* Info row */
      .ls-info {
        display: flex; justify-content: space-between; align-items: center;
        margin-top: 10px;
        animation: ls-fadeUp 0.5s ease-out 0.3s backwards;
      }
      .ls-file {
        font-family: 'SF Mono', Monaco, Consolas, monospace;
        font-size: 11px; color: rgba(61, 50, 41, 0.5);
        max-width: 170px; overflow: hidden;
        text-overflow: ellipsis; white-space: nowrap;
      }
      .ls-count {
        font-size: 11px; color: rgba(61, 50, 41, 0.4);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      /* Bytes */
      .ls-bytes {
        font-size: 10px; color: rgba(61, 50, 41, 0.35);
        margin-top: 6px;
        font-variant-numeric: tabular-nums;
        animation: ls-fadeUp 0.5s ease-out 0.4s backwards;
      }

      @keyframes ls-fadeUp {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* Loading dots */
      .ls-dots { display: inline-block; margin-left: 1px; }
      .ls-dots span {
        display: inline-block; width: 3px; height: 3px;
        border-radius: 50%; background: currentColor;
        margin: 0 1px; opacity: 0.3;
        animation: ls-dot 1.4s ease-in-out infinite;
      }
      .ls-dots span:nth-child(2) { animation-delay: 0.2s; }
      .ls-dots span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes ls-dot {
        0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
        40% { opacity: 1; transform: scale(1); }
      }
    </style>
    <script type="module" crossorigin src="/assets/index-CJnjdk23.js"></script>

  <body class="bg-[#c3b091] text-[#3d3229]">
    <div id="root"></div>

    <!-- Loading Screen -->
    <div id="ls">
      <div class="ls-card">
        <div class="ls-logo">🃏</div>
        <div class="ls-title">CardPVP</div>
        <div class="ls-pct" id="ls-pct">0%</div>
        <div class="ls-track">
          <div class="ls-fill" id="ls-fill"></div>
        </div>
        <div class="ls-info">
          <span class="ls-file" id="ls-file">初始化中<span class="ls-dots"><span></span><span></span><span></span></span></span>
          <span class="ls-count" id="ls-count"></span>
        </div>
        <div class="ls-bytes" id="ls-bytes">0 B / ~—</div>
      </div>
    </div>

    <script>
      (function () {
        var fill = document.getElementById('ls-fill');
        var pctEl = document.getElementById('ls-pct');
        var fileEl = document.getElementById('ls-file');
        var bytesEl = document.getElementById('ls-bytes');
        var countEl = document.getElementById('ls-count');
        var screen = document.getElementById('ls');

        var isDev = !!document.querySelector('script[src*="/@vite/client"]');
        var loadedBytes = 0;
        var fileCount = 0;
        // 固定预估值，不动态扩容（动态扩容会导致分子分母同涨，进度卡住）
        var expectedFiles = isDev ? 53 : 15;
        var lastPct = -1;
        var done = false;

        function fmt(b) {
          if (b < 1024) return b + ' B';
          if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
          return (b / 1048576).toFixed(2) + ' MB';
        }

        var lastName = '';
        function setFile(name) {
          if (name === lastName) return;
          lastName = name;
          fileEl.innerHTML = name + '<span class="ls-dots"><span></span><span></span><span></span></span>';
        }

        function render() {
          var r = Math.min(fileCount / expectedFiles, 0.95);
          var pct = Math.round(r * 100);
          if (pct !== lastPct) {
            lastPct = pct;
            fill.style.width = pct + '%';
            pctEl.textContent = pct + '%';
            bytesEl.textContent = fmt(loadedBytes) + ' / ' + fileCount + ' 个文件';
            countEl.textContent = fileCount > 0 ? fileCount + ' / ~' + expectedFiles : '';
          }
        }

        function shouldTrack(url) {
          if (!url) return false;
          if (url.charAt(0) === '/' && url.charAt(1) === '@') return false;
          if (url.indexOf('socket.io') !== -1) return false;
          if (url.indexOf('data:') === 0) return false;
          if (url.indexOf('blob:') === 0) return false;
          return true;
        }

        if (window.PerformanceObserver) {
          try {
            var obs = new PerformanceObserver(function (list) {
              var entries = list.getEntries();
              for (var i = 0; i < entries.length; i++) {
                var e = entries[i];
                if (!shouldTrack(e.name)) continue;
                var size = e.transferSize || e.encodedBodySize || e.decodedBodySize || 0;
                if (size > 0) {
                  loadedBytes += size;
                  fileCount++;
                  var name = e.name.split('/').pop().split('?')[0] || e.name;
                  setFile(name);
                }
              }
              render();
            });
            obs.observe({ type: 'resource', buffered: true });
          } catch (err) { /* ignore */ }
        }

        // 平滑动画到 100%
        function animateTo100() {
          var startPct = lastPct;
          var startTime = performance.now();
          var duration = 400; // ms
          function step(now) {
            var elapsed = now - startTime;
            var t = Math.min(elapsed / duration, 1);
            // easeOutCubic
            var eased = 1 - Math.pow(1 - t, 3);
            var pct = Math.round(startPct + (100 - startPct) * eased);
            if (pct > lastPct) {
              lastPct = pct;
              fill.style.width = pct + '%';
              pctEl.textContent = pct + '%';
            }
            if (t < 1) {
              requestAnimationFrame(step);
            } else {
              // 动画结束，开始淡出
              fill.style.width = '100%';
              pctEl.textContent = '100%';
              bytesEl.textContent = fmt(loadedBytes) + ' / ' + fileCount + ' 个文件';
              countEl.textContent = fileCount + ' 个文件';
              setFile('加载完成');
              setTimeout(function () {
                screen.classList.add('done');
                setTimeout(function () {
                  if (screen.parentNode) screen.parentNode.removeChild(screen);
                }, 700);
              }, 200);
            }
          }
          requestAnimationFrame(step);
        }

        function complete() {
          if (done) return;
          done = true;
          animateTo100();
        }

        window.addEventListener('app-ready', complete);

        // Safety timeout: force complete after 15s
        setTimeout(function () {
          if (!done) complete();
        }, 15000);
      })();
    </script>

  </body>
</html>
